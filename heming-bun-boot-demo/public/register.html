<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Heming Blog</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<nav>
  <span class="brand"><a href="/">📝 Heming Blog</a></span>
  <span id="nav-user"></span>
</nav>

<div class="container">
  <div class="form">
    <h1>Register</h1>
    <div class="error" id="error" style="display:none"></div>
    <label>Username</label>
    <input id="name" placeholder="Enter username" autocomplete="username">
    <label>Password</label>
    <input id="password" type="password" placeholder="Enter password (min 6 chars)" autocomplete="new-password">
    <button onclick="doRegister()">Register</button>
    <div class="link">Already have an account? <a href="/login.html">Log in</a></div>
  </div>
</div>

<script src="/app.js"></script>
<script>
if (api.isLoggedIn()) location.href = "/index.html";

async function doRegister() {
  const name = document.getElementById("name").value.trim();
  const password = document.getElementById("password").value;
  const err = document.getElementById("error");

  if (!name || !password) {
    err.textContent = "Please enter username and password";
    err.style.display = "block";
    return;
  }
  if (password.length < 6) {
    err.textContent = "Password must be at least 6 characters";
    err.style.display = "block";
    return;
  }

  const res = await api.register(name, password);
  if (res.code === 0) {
    // auto login after register
    const loginRes = await api.login(name, password);
    if (loginRes.code === 0) location.href = "/index.html";
    else location.href = "/login.html";
  } else {
    err.textContent = res.message || "Registration failed";
    err.style.display = "block";
  }
}

document.getElementById("password").addEventListener("keydown", (e) => {
  if (e.key === "Enter") doRegister();
});
</script>
</body>
</html>
