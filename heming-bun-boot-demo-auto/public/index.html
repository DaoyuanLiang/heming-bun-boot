<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
    nav { background: #1a73e8; color: #fff; padding: 16px 24px; font-size: 18px; font-weight: 600; }
    .container { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    h2 { margin-bottom: 16px; }
    .form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .form-row input { flex: 1; min-width: 120px; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    .form-row input:focus { outline: none; border-color: #1a73e8; }
    button { background: #1a73e8; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    button:hover { background: #1557b0; }
    button.danger { background: #e74c3c; }
    button.danger:hover { background: #c0392b; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f8f9fa; font-weight: 600; }
    .actions { display: flex; gap: 8px; }
    .empty { text-align: center; padding: 48px; color: #999; }
    .error { color: #e74c3c; padding: 12px; background: #fdeaea; border-radius: 6px; margin-bottom: 12px; display: none; }
    .price::before { content: "$"; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
    .badge.ok { background: #e8f5e9; color: #2e7d32; }
    .badge.low { background: #fff3e0; color: #e65100; }
    .badge.empty-stock { background: #fdeaea; color: #c62828; }
  </style>
</head>
<body>
  <nav>📦 Product Catalog</nav>
  <div class="container">
    <div id="error" class="error"></div>

    <div class="card">
      <h2>Add Product</h2>
      <div class="form-row">
        <input id="name" placeholder="Product name" />
        <input id="price" type="number" step="0.01" placeholder="Price" />
        <input id="stock" type="number" placeholder="Stock" />
        <button onclick="addProduct()">Add</button>
      </div>
    </div>

    <div class="card">
      <h2>Products</h2>
      <div id="loading">Loading...</div>
      <table id="table" style="display:none">
        <thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="empty" style="display:none">No products yet. Add one above!</div>
    </div>
  </div>

  <script>
    const BASE = "/api/products";

    function showError(msg) {
      const el = document.getElementById("error");
      el.textContent = msg;
      el.style.display = "block";
      setTimeout(() => el.style.display = "none", 3000);
    }

    async function api(path, opts = {}) {
      const res = await fetch(BASE + path, {
        headers: { "content-type": "application/json" },
        ...opts,
      });
      const body = await res.json();
      if (body.code !== 0) throw new Error(body.message || "Unknown error");
      return body.data;
    }

    function stockBadge(n) {
      if (n > 50) return `<span class="badge ok">${n}</span>`;
      if (n > 0)  return `<span class="badge low">${n}</span>`;
      return `<span class="badge empty-stock">Out of stock</span>`;
    }

    async function loadProducts() {
      document.getElementById("loading").style.display = "";
      document.getElementById("table").style.display = "none";
      document.getElementById("empty").style.display = "none";
      try {
        const products = await api("");
        if (!products || products.length === 0) {
          document.getElementById("empty").style.display = "";
          document.getElementById("tbody").innerHTML = "";
        } else {
          document.getElementById("tbody").innerHTML = products.map(p => `
            <tr>
              <td>${p.id}</td>
              <td>${esc(p.name)}</td>
              <td class="price">${Number(p.price).toFixed(2)}</td>
              <td>${stockBadge(p.stock)}</td>
              <td class="actions">
                <button class="danger" onclick="deleteProduct(${p.id})">Delete</button>
              </td>
            </tr>
          `).join("");
          document.getElementById("table").style.display = "";
        }
      } catch (e) {
        showError(e.message);
        document.getElementById("empty").style.display = "";
      }
      document.getElementById("loading").style.display = "none";
    }

    async function addProduct() {
      const name = document.getElementById("name").value.trim();
      const price = document.getElementById("price").value;
      const stock = document.getElementById("stock").value;
      if (!name) return showError("Name is required");
      if (!price || price < 0) return showError("Valid price is required");

      try {
        await api("", {
          method: "POST",
          body: JSON.stringify({ name, price: Number(price), stock: Number(stock || 0) }),
        });
        document.getElementById("name").value = "";
        document.getElementById("price").value = "";
        document.getElementById("stock").value = "";
        await loadProducts();
      } catch (e) {
        showError(e.message);
      }
    }

    async function deleteProduct(id) {
      if (!confirm("Delete this product?")) return;
      try {
        await api(`/${id}`, { method: "DELETE" });
        await loadProducts();
      } catch (e) {
        showError(e.message);
      }
    }

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    loadProducts();
  </script>
</body>
</html>
